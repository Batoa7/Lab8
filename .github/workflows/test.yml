name: Tests

# push болон pull request бүрт тест ажиллуулна
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # pom.xml-д release 17 заасан тул JDK 17 ашиглана
      - run: mvn test
